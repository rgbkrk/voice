[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.dependencies]
candle-core = { version = "0.11" }
candle-nn = { version = "0.11" }
candle-transformers = { version = "0.11" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hf-hub = "0.5"
safetensors = "0.8"
hound = "3"
tokenizers = "0.22"
