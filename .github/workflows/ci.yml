name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ github.repository }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ github.repository }}-cargo-

      - run: cargo fmt --check

      - run: cargo clippy --workspace -- -D warnings

      - run: cargo test --workspace

      - run: cargo build -p voice

      - run: scripts/verify_cli_mcp_surface.py --voice-bin target/debug/voice --skip-daemon

  sidecar-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip

      - run: python -m pip install -r examples/webrtc-sidecar/requirements.txt pytest

      - run: python examples/webrtc-sidecar/loopback_smoke.py

      - run: |
          python -m pytest -q \
            examples/webrtc-sidecar/test_sidecar.py \
            examples/webrtc-sidecar/test_post_voice_stream.py \
            examples/webrtc-sidecar/test_drain_sidecar_audio.py \
            examples/webrtc-sidecar/test_echo_sidecar_audio.py \
            examples/webrtc-sidecar/test_stream_transcribe_loopback_smoke.py \
            examples/webrtc-sidecar/test_full_duplex_loopback_smoke.py

  python-helpers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: |
          python -m py_compile \
            scripts/macos_release_compare.py \
            scripts/verify_cli_mcp_surface.py \
            scripts/verify_hermes_voice_config.py \
            scripts/verify_webrtc_sidecar_service.py \
            tests/test_install_webrtc_sidecar_service.py \
            tests/test_macos_release_compare.py \
            tests/test_verify_cli_mcp_surface.py \
            tests/test_verify_hermes_voice_config.py \
            tests/test_verify_local_hermes_voice_stack.py \
            tests/test_verify_telegram_voice_contract.py \
            tests/test_verify_webrtc_sidecar_service.py

      - run: python -m unittest discover -s tests

      - run: |
          bash -n \
            scripts/install_webrtc_sidecar_service.sh \
            scripts/verify_hermes_command_tts.sh \
            scripts/verify_local_hermes_voice_stack.sh \
            scripts/verify_telegram_voice_contract.sh \
            scripts/verify_whatsapp_voice_contract.sh
