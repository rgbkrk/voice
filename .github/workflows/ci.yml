name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ github.repository }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ github.repository }}-cargo-

      - run: cargo fmt --check

      - run: cargo clippy --workspace -- -D warnings

      - run: cargo test --workspace

  sidecar-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip

      - run: python -m pip install -r examples/webrtc-sidecar/requirements.txt pytest

      - run: python examples/webrtc-sidecar/loopback_smoke.py

      - run: |
          python -m pytest -q \
            examples/webrtc-sidecar/test_sidecar.py \
            examples/webrtc-sidecar/test_post_voice_stream.py \
            examples/webrtc-sidecar/test_drain_sidecar_audio.py \
            examples/webrtc-sidecar/test_echo_sidecar_audio.py
